<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- LABRA Pastelería Artesanal · Portada Historia Destacada: Opiniones -->
  <!-- Estilo: Transparente (Para Canva / Fotos) -->
  <defs>
    <style>
      .icon-element { vector-effect: non-scaling-stroke; }
    </style>
  </defs>
  
  
  
  
  <g class="icon-element">

            <!-- Corazón Artesanal -->
            <path d="M 250 338 
                     C 220 312 165 264 165 215 
                     C 165 180 192 155 225 155 
                     C 238 155 245 160 250 166 
                     C 255 160 262 155 275 155 
                     C 308 155 335 180 335 215 
                     C 335 264 280 312 250 338 Z" 
                  fill="rgba(222, 170, 161, 0.15)" stroke="#46543D" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Silueta interior delicada -->
            <path d="M 250 308 
                     C 228 288 185 248 185 216 
                     C 185 194 204 175 226 175 
                     C 236 175 244 180 250 188 
                     C 256 180 264 175 274 175 
                     C 296 175 315 194 315 216 
                     C 315 248 272 288 250 308 Z" 
                  fill="none" stroke="#DEAAA1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
            
            <!-- 5 Estrellitas (Arco de 5.0) -->
            <!-- Estrella 1 -->
            <path transform="translate(160, 115) scale(0.6)" d="M 25 5 L 31 18 L 45 19 L 34 29 L 37 43 L 25 36 L 13 43 L 16 29 L 5 19 L 19 18 Z" fill="#DEAAA1"/>
            <!-- Estrella 2 -->
            <path transform="translate(195, 95) scale(0.6)" d="M 25 5 L 31 18 L 45 19 L 34 29 L 37 43 L 25 36 L 13 43 L 16 29 L 5 19 L 19 18 Z" fill="#DEAAA1"/>
            <!-- Estrella 3 (Cima) -->
            <path transform="translate(235, 85) scale(0.7)" d="M 25 5 L 31 18 L 45 19 L 34 29 L 37 43 L 25 36 L 13 43 L 16 29 L 5 19 L 19 18 Z" fill="#DEAAA1"/>
            <!-- Estrella 4 -->
            <path transform="translate(275, 95) scale(0.6)" d="M 25 5 L 31 18 L 45 19 L 34 29 L 37 43 L 25 36 L 13 43 L 16 29 L 5 19 L 19 18 Z" fill="#DEAAA1"/>
            <!-- Estrella 5 -->
            <path transform="translate(310, 115) scale(0.6)" d="M 25 5 L 31 18 L 45 19 L 34 29 L 37 43 L 25 36 L 13 43 L 16 29 L 5 19 L 19 18 Z" fill="#DEAAA1"/>
            
            <!-- Destellos inferiores -->
            <circle cx="150" cy="290" r="3" fill="#DEAAA1"/>
            <circle cx="350" cy="290" r="3" fill="#DEAAA1"/>
        
  </g>
</svg>