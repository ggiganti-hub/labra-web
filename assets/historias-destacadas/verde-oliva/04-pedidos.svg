<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- LABRA Pastelería Artesanal · Portada Historia Destacada: Pedidos -->
  <!-- Estilo: Verde Oliva Signature -->
  <defs>
    <style>
      .icon-element { vector-effect: non-scaling-stroke; }
    </style>
  </defs>
  
  <circle cx="250" cy="250" r="235" fill="#46543D" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="rgba(243, 205, 196, 0.35)" stroke-width="1.8" stroke-dasharray="5 5" />
  
  <g class="icon-element">

            <!-- Asas de Cordón Rústico / Artesanal -->
            <path d="M 214 218 C 214 148 286 148 286 218" fill="none" stroke="#FAF7F2" stroke-width="5.5" stroke-linecap="round"/>
            <path d="M 224 218 C 224 165 276 165 276 218" fill="none" stroke="#F3CDC4" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
            
            <!-- Cuerpo de la Bolsa Kraft Boutique -->
            <path d="M 172 218 L 158 358 C 158 358 205 368 250 368 C 295 368 342 358 342 358 L 328 218 Z" 
                  fill="rgba(243, 205, 196, 0.15)" stroke="#FAF7F2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Pliegue de Borde Superior -->
            <path d="M 172 218 Q 250 225 328 218" fill="none" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round"/>
            
            <!-- Pliegues Fuelle Típicos de Bolsa de Pastelería -->
            <path d="M 250 224 V 338" fill="none" stroke="#FAF7F2" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.75"/>
            <path d="M 215 364 L 250 338 L 285 364" fill="none" stroke="#FAF7F2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
            
            <!-- Hilo y Etiqueta Colgante (Tag de Encargo) -->
            <path d="M 278 184 C 286 200 295 214 295 228" fill="none" stroke="#F3CDC4" stroke-width="2.5" stroke-linecap="round"/>
            <g transform="rotate(12 295 240)">
                <rect x="282" y="228" width="28" height="38" rx="4" fill="#46543D" stroke="#F3CDC4" stroke-width="3"/>
                <circle cx="296" cy="235" r="2.5" fill="#F3CDC4"/>
                <!-- Relojito / 48 hs dentro del tag -->
                <circle cx="296" cy="252" r="7" fill="none" stroke="#F3CDC4" stroke-width="1.8"/>
                <path d="M 296 248 V 252 L 299 252" stroke="#F3CDC4" stroke-width="1.8" stroke-linecap="round"/>
            </g>
            
            <!-- Sello o Faja Central Elegante -->
            <path d="M 194 286 Q 250 293 306 286" fill="none" stroke="#F3CDC4" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 196 295 Q 250 302 304 295" fill="none" stroke="#F3CDC4" stroke-width="2" stroke-linecap="round"/>
            
            <!-- Destellos -->
            <path d="M 136 195 Q 136 204 143 204 Q 136 204 136 213 Q 136 204 129 204 Q 136 204 136 195 Z" fill="#F3CDC4"/>
            <path d="M 364 195 Q 364 203 370 203 Q 364 203 364 211 Q 364 203 358 203 Q 364 203 364 195 Z" fill="#F3CDC4"/>
            <circle cx="140" cy="305" r="3.5" fill="#F3CDC4"/>
        
  </g>
</svg>