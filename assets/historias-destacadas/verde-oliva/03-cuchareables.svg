<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- LABRA Pastelería Artesanal · Portada Historia Destacada: Cuchareables -->
  <!-- Estilo: Verde Oliva Signature -->
  <defs>
    <style>
      .icon-element { vector-effect: non-scaling-stroke; }
    </style>
  </defs>
  
  <circle cx="250" cy="250" r="235" fill="#46543D" />
  <circle cx="250" cy="250" r="218" fill="none" stroke="rgba(243, 205, 196, 0.35)" stroke-width="1.8" stroke-dasharray="5 5" />
  
  <g class="icon-element">

            <!-- Pote de Postre (vasito térmico 250cc) -->
            <path d="M 166 246 L 182 352 C 182 352 208 364 246 364 C 284 364 310 352 310 352 L 326 246" 
                  fill="rgba(243, 205, 196, 0.15)" stroke="#FAF7F2" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="246" cy="246" rx="80" ry="16" fill="none" stroke="#FAF7F2" stroke-width="5.5"/>
            
            <!-- Banda / Etiqueta del Pote LABRA -->
            <path d="M 173 294 Q 246 306 319 294" fill="none" stroke="#F3CDC4" stroke-width="4" stroke-linecap="round"/>
            <path d="M 176 304 Q 246 316 316 304" fill="none" stroke="#F3CDC4" stroke-width="2.5" stroke-linecap="round"/>
            <!-- Pequeño sello en la faja -->
            <path d="M 246 295 Q 246 301 249 301 Q 246 301 246 307 Q 246 301 243 301 Q 246 301 246 295 Z" fill="#F3CDC4"/>
            
            <!-- Remolinos voluptuosos de crema / chocotorta / tiramisú sobre el borde -->
            <path d="M 168 244 
                     C 176 220 198 218 214 226 
                     C 228 212 252 212 266 222 
                     C 282 212 304 218 314 238 
                     C 324 244 326 248 326 248" 
                  fill="rgba(243, 205, 196, 0.15)" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 194 236 Q 224 226 254 236" fill="none" stroke="#F3CDC4" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Lluvia de cacao amargo / crumbs crocantes -->
            <circle cx="204" cy="226" r="2.5" fill="#F3CDC4"/>
            <circle cx="228" cy="220" r="3" fill="#F3CDC4"/>
            <circle cx="256" cy="224" r="2.5" fill="#F3CDC4"/>
            <circle cx="282" cy="228" r="3" fill="#F3CDC4"/>
            
            <!-- La Cuchara: sumergida lista para deleitarse -->
            <!-- Mango largo que sube hacia la derecha -->
            <path d="M 238 232 L 328 132 C 334 125 344 129 342 137 L 254 238" 
                  fill="#F3CDC4" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Curva de la cabeza de la cuchara dentro de la crema -->
            <path d="M 226 230 C 220 242 228 254 242 250 C 252 246 254 234 244 228" 
                  fill="none" stroke="#FAF7F2" stroke-width="5" stroke-linecap="round"/>
            
            <!-- Destellos de dulzura -->
            <path d="M 142 205 Q 142 214 149 214 Q 142 214 142 223 Q 142 214 135 214 Q 142 214 142 205 Z" fill="#F3CDC4"/>
            <path d="M 352 185 Q 352 192 357 192 Q 352 192 352 199 Q 352 192 347 192 Q 352 192 352 185 Z" fill="#F3CDC4"/>
            <circle cx="340" cy="285" r="3.5" fill="#F3CDC4"/>
        
  </g>
</svg>